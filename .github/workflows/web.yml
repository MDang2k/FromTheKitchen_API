name: Web

# Only frontend changes run this; the API has its own workflow (ci-cd.yml).
on:
  push:
    paths:
      - "FromTheKitchen_Web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "FromTheKitchen_Web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FromTheKitchen_Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FromTheKitchen_Web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
