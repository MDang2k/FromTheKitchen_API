name: CI/CD

# Only API changes run this; the frontend has its own workflow (web.yml),
# so a frontend-only change never redeploys the API.
on:
  push:
    paths:
      - "FromTheKitchen_API/**"
      - "FromTheKitchen_API.Tests/**"
      - "FromTheKitchen_API.slnx"
      - "docs/api/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    paths:
      - "FromTheKitchen_API/**"
      - "FromTheKitchen_API.Tests/**"
      - "FromTheKitchen_API.slnx"
      - "docs/api/**"
      - ".github/workflows/ci-cd.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test --configuration Release

  deploy:
    needs: test
    # Skipped until the Azure app exists (repository variable AZURE_WEBAPP_NAME)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish FromTheKitchen_API --configuration Release --output publish
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
